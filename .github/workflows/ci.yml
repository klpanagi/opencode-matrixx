name: CI

on:
  push:
    branches: [master, dev]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    branches: [master, dev]
    paths-ignore:
      - '**.md'
      - 'docs/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Block PRs targeting master branch
  block-master-pr:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Check PR target branch
        run: |
          if [ "${{ github.base_ref }}" = "master" ]; then
            echo "::error::PRs to master branch are not allowed. Please target the 'dev' branch instead."
            echo ""
            echo "PULL REQUESTS TO MASTER ARE BLOCKED"
            echo ""
            echo "All PRs must target the 'dev' branch."
            echo "Please close this PR and create a new one targeting 'dev'."
            exit 1
          else
            echo "PR targets '${{ github.base_ref }}' branch - OK"
          fi

  # ---------------------------------------------------------------------------
  # V2 is the AUTHORITATIVE surface as of the V1->V2 migration cutover.
  # This job is REQUIRED: `build` depends on it, so a failure here blocks merge.
  # It runs the full test suite (both V1-retained and V2-native tests).
  # ---------------------------------------------------------------------------
  test-v2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Install dependencies
        run: bun install
        env:
          BUN_INSTALL_ALLOW_SCRIPTS: "@ast-grep/napi"

      - name: Run mock-heavy tests (isolated)
        run: |
          # These files use mock.module() which pollutes bun's module cache
          # when run in parallel. Each invocation runs in a separate process.
          # Single source: script/mock-heavy-list.txt — do not duplicate inline.
          while IFS= read -r test || [ -n "$test" ]; do
            [ -z "$test" ] && continue
            bun test "$test"
          done < script/mock-heavy-list.txt

      - name: Run remaining tests
        run: |
          # Run all other tests together. The mock-heavy files above are excluded
          # via single source script/mock-heavy-list.txt to prevent double-running and pollution.
          find tests script -name '*.test.ts' -type f \
            | grep -v -F -f script/mock-heavy-list.txt \
            | xargs bun test

  # ---------------------------------------------------------------------------
  # V1 COMPAT — NON-BLOCKING, ONE CYCLE ONLY.
  #
  # SANITY: V1 is retained behind src/compat/v1-shim.ts. This job exists purely to
  # keep that retained surface honest for one cycle. It is deliberately NOT in
  # any `needs:` list and is `continue-on-error`, so a red V1 job cannot block a
  # merge to `dev`.
  #
  # SUNSET: delete this job in the first cycle after the PR that carries this
  # cutover has merged to `dev` and completed one full green/red observation on
  # `dev`. Do not extend the sunset without re-recording the shim-removal
  # decision in .matrixx/notepads/opencode-v1-to-v2-migration/decisions.md.
  #
  # BLOCKED BY (do not read this job as a V2 verdict): the V1->V2 shim CANNOT be
  # removed yet. `AgentEditor` in @opencode/plugin@2.0.16 exposes only
  # list/get/default/update/remove — there is no `add` — so V2 cannot introduce
  # any of the 14 Matrixx agents. V1 stays the only introducing mechanism.
  # See src/plugin/v2/agent-partition.ts.
  # ---------------------------------------------------------------------------
  test-v1-compat:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Install dependencies
        run: bun install
        env:
          BUN_INSTALL_ALLOW_SCRIPTS: "@ast-grep/napi"

      - name: Run V1-surface compat tests (advisory)
        run: bun test tests/plugin/dual-entry.test.ts tests/config/hooks-v1-keys.test.ts tests/cli/runtime/compat.test.ts tests/hooks/document-reader-guard-v1-wiring.test.ts tests/shared/permission-compat.test.ts

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Install dependencies
        run: bun install
        env:
          BUN_INSTALL_ALLOW_SCRIPTS: "@ast-grep/napi"

      - name: Type check
        run: bun run typecheck

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Install dependencies
        run: bun install
        env:
          BUN_INSTALL_ALLOW_SCRIPTS: "@ast-grep/napi"

      - name: Lint
        run: bun run lint

  build:
    runs-on: ubuntu-latest
    needs: [test-v2, typecheck, lint]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Install dependencies
        run: bun install
        env:
          BUN_INSTALL_ALLOW_SCRIPTS: "@ast-grep/napi"

      - name: Build
        run: bun run build

      - name: Verify build output
        run: |
          test -f dist/index.js || (echo "ERROR: dist/index.js not found!" && exit 1)
          test -f dist/index.d.ts || (echo "ERROR: dist/index.d.ts not found!" && exit 1)

      - name: Auto-commit schema changes
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: |
          if git diff --quiet assets/matrixx.schema.json; then
            echo "No schema changes to commit"
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add assets/matrixx.schema.json
            git commit -m "chore: auto-update schema.json"
            git push
          fi

  draft-release:
    runs-on: ubuntu-latest
    needs: [build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - run: git fetch --force --tags

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Generate release notes
        id: notes
        run: |
          NOTES=$(bun run script/generate-changelog.ts)
          echo "notes<<EOF" >> $GITHUB_OUTPUT
          echo "$NOTES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create or update draft release
        run: |
          EXISTING_DRAFT=$(gh release list --json tagName,isDraft --jq '.[] | select(.isDraft == true and .tagName == "next") | .tagName')
          
          if [ -n "$EXISTING_DRAFT" ]; then
            echo "Updating existing draft release..."
            gh release edit next \
              --title "Upcoming Changes 🍿" \
              --notes-file - \
              --draft <<'EOF'
          ${{ steps.notes.outputs.notes }}
          EOF
          else
            echo "Creating new draft release..."
            gh release create next \
              --title "Upcoming Changes 🍿" \
              --notes-file - \
              --draft \
              --target ${{ github.sha }} <<'EOF'
          ${{ steps.notes.outputs.notes }}
          EOF
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

name: Config App

on:
  push:
    branches: [master, dev]
    paths:
      - "apps/matrixx-config/**"
  pull_request:
    branches: [master, dev]
    paths:
      - "apps/matrixx-config/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/matrixx-config
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Install dependencies
        run: bun install
        env:
          BUN_INSTALL_ALLOW_SCRIPTS: "@ast-grep/napi"

      - name: Build matrixx schema
        working-directory: .
        run: |
          bun install
          bun run build:schema
        env:
          BUN_INSTALL_ALLOW_SCRIPTS: "@ast-grep/napi"

      - name: Sync schema
        run: bun run scripts/sync-schema.mjs

      - name: Check TypeScript
        run: bun run check

  build-linux:
    runs-on: ubuntu-latest
    needs: [check]
    defaults:
      run:
        working-directory: apps/matrixx-config
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf libgtk-3-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev

      - name: Install dependencies
        run: bun install
        env:
          BUN_INSTALL_ALLOW_SCRIPTS: "@ast-grep/napi"

      - name: Build matrixx schema
        working-directory: .
        run: |
          bun install
          bun run build:schema
        env:
          BUN_INSTALL_ALLOW_SCRIPTS: "@ast-grep/napi"

      - name: Sync schema
        run: bun run scripts/sync-schema.mjs

      - name: Build frontend
        run: bun run build

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2"

      - name: Build Tauri app
        run: cargo tauri build

  build-macos:
    runs-on: macos-latest
    needs: [check]
    defaults:
      run:
        working-directory: apps/matrixx-config
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Install dependencies
        run: bun install
        env:
          BUN_INSTALL_ALLOW_SCRIPTS: "@ast-grep/napi"

      - name: Build matrixx schema
        working-directory: .
        run: |
          bun install
          bun run build:schema
        env:
          BUN_INSTALL_ALLOW_SCRIPTS: "@ast-grep/napi"

      - name: Sync schema
        run: bun run scripts/sync-schema.mjs

      - name: Build frontend
        run: bun run build

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2"

      - name: Build Tauri app
        run: cargo tauri build

  build-windows:
    runs-on: windows-latest
    needs: [check]
    defaults:
      run:
        working-directory: apps/matrixx-config
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Install dependencies
        run: bun install
        env:
          BUN_INSTALL_ALLOW_SCRIPTS: "@ast-grep/napi"

      - name: Build matrixx schema
        working-directory: .
        run: |
          bun install
          bun run build:schema
        env:
          BUN_INSTALL_ALLOW_SCRIPTS: "@ast-grep/napi"

      - name: Sync schema
        run: bun run scripts/sync-schema.mjs

      - name: Build frontend
        run: bun run build

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2"

      - name: Build Tauri app
        run: cargo tauri build
